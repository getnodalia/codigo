[workspace]
resolver = "2"
members = [
    "crates/codigo-text",
    "crates/codigo-syntax",
    "crates/codigo-workspace",
    "crates/codigo-engine",
    "crates/codigo-lsp",
    "crates/codigo-dap",
    "crates/codigo-git",
    "crates/codigo-github",
    "crates/codigo-ai",
    "crates/codigo-term",
    "crates/codigo-quality",
    "crates/codigo-nodalia",
    "apps/codigo",
]

[workspace.package]
version = "0.6.1"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/getnodalia/codigo"
authors = ["Nodalia"]

[workspace.dependencies]
codigo-text = { path = "crates/codigo-text" }
codigo-syntax = { path = "crates/codigo-syntax" }
codigo-workspace = { path = "crates/codigo-workspace" }
codigo-engine = { path = "crates/codigo-engine" }
codigo-lsp = { path = "crates/codigo-lsp" }
codigo-dap = { path = "crates/codigo-dap" }
codigo-git = { path = "crates/codigo-git" }
codigo-github = { path = "crates/codigo-github" }
codigo-ai = { path = "crates/codigo-ai" }
codigo-term = { path = "crates/codigo-term" }
codigo-quality = { path = "crates/codigo-quality" }
codigo-nodalia = { path = "crates/codigo-nodalia" }

ropey = { version = "1.6", default-features = false, features = ["simd"] }
unicode-segmentation = "1"
unicode-width = "0.2"
regex = "1"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
directories = "6"
tempfile = "3"

tree-sitter = "0.27"
streaming-iterator = "0.1"

eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "system_fonts", "wayland", "x11"] }
egui = "0.37"
nodalia-theme = { git = "https://github.com/getnodalia/nodalia-design", rev = "8bb4b7dcbf186644ab606b806569c851056cee2c", features = ["egui", "creator", "engineering"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 4
