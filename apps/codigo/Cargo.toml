[package]
name = "codigo-app"
description = "Código's desktop app, drawn in the Nodalia Design Language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "codigo"
path = "src/main.rs"

[dependencies]
codigo-text.workspace = true
unicode-width.workspace = true
codigo-syntax.workspace = true
codigo-workspace.workspace = true
codigo-engine.workspace = true
eframe.workspace = true
egui.workspace = true
nodalia-theme.workspace = true
nodalia-update = { git = "https://github.com/getnodalia/nodalia-design", rev = "114848a2ff1a7c29c9a5432fb12e955fbe0aeef2", features = ["egui"] }
png = "0.17"
sys-locale = "0.3"
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd = "0.17"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = "=5.19.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
